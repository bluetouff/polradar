name: Site
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}
concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Dater le cache de publication
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: cache-date
        run: date -u '+day=%F' >> "$GITHUB_OUTPUT"
      - name: Retrouver les rendus vérifiés de main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: renders
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/polradar-pages
            .cache/polradar-og
          key: polradar-renders-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json', '.node-version', 'scripts/build-pages.mjs', 'scripts/render-social-images.mjs') }}-${{ steps.cache-date.outputs.day }}
          restore-keys: |
            polradar-renders-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json', '.node-version', 'scripts/build-pages.mjs', 'scripts/render-social-images.mjs') }}-
      - run: npm run format:check
      - run: npm run security:audit
      - run: npx --no-install playwright install --with-deps chromium
      - run: npm run validate
      - name: Preserve published history
        env:
          HISTORY_BASE: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
        run: node scripts/check-history.mjs
      - run: npm run test:e2e
      - name: Conserver les rendus validés de main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.renders.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/polradar-pages
            .cache/polradar-og
          key: ${{ steps.renders.outputs.cache-primary-key }}
      - name: Construire l’archive du commit testé
        env:
          GSC_VERIFICATION_FILE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.GSC_VERIFICATION_FILE || '' }}
        run: |
          python3 scripts/package-release.py
          python3 scripts/package-stats.py
          python3 scripts/package-corpus.py
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: mcp/go.mod
          cache-dependency-path: mcp/go.sum
      - name: Vérifier le contrat des données sur cette archive
        run: |
          python3 scripts/test-mcp-release.py artifacts/site.tar.gz
          python3 scripts/test-mcp-compatibility.py artifacts/site.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: validated-site
          path: artifacts/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish static release
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            src/lib/poll-publication.mjs
            src/data/fenetres-sondages.json
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: validated-site
          path: artifacts
      - name: Publish once per commit
        working-directory: artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          sha256sum --check site.sha256
          sha256sum --check polradar-goaccess.sha256
          sha256sum --check corpus-v1.sha256
          node --input-type=module -e "import { checkPollPublication } from '../src/lib/poll-publication.mjs'; checkPollPublication();"

          tag="site-${SOURCE_SHA}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo 'This commit already has a release; no asset is overwritten.'
            exit 0
          fi
          gh release create "$tag" site.tar.gz site.sha256 polradar-goaccess.tar.gz polradar-goaccess.sha256 corpus-v1.tar.gz corpus-v1.sha256 \
            --target "$SOURCE_SHA" --title "Site ${SOURCE_SHA:0:12}" \
            --notes "Static site built and checked from commit ${SOURCE_SHA}." --latest
