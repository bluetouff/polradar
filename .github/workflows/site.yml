name: Site
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}
concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run format:check
      - run: npm run security:audit
      - run: npm run validate
      - name: Preserve published history
        env:
          HISTORY_BASE: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
        run: node scripts/check-history.mjs
      - run: npx --no-install playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Package validated main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          python3 scripts/package-release.py
          python3 scripts/package-stats.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: validated-site
          path: artifacts/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish static release
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: validated-site
          path: artifacts
      - name: Publish once per commit
        working-directory: artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          sha256sum --check site.sha256
          sha256sum --check polradar-goaccess.sha256
          tag="site-${SOURCE_SHA}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo 'This commit already has a release; no asset is overwritten.'
            exit 0
          fi
          gh release create "$tag" site.tar.gz site.sha256 polradar-goaccess.tar.gz polradar-goaccess.sha256 \
            --target "$SOURCE_SHA" --title "Site ${SOURCE_SHA:0:12}" \
            --notes "Static site built and checked from commit ${SOURCE_SHA}." --latest
