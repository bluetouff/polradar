name: Édition publique
on:
  workflow_run:
    workflows: [Site]
    types: [completed]
    branches: [main]

permissions:
  contents: read
concurrency:
  group: polradar-public-verification
  cancel-in-progress: true

jobs:
  verify:
    name: Vérifier l’édition servie
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
          sparse-checkout: scripts/etat-production.py
          sparse-checkout-cone-mode: false
      - name: Contrôler la révision effectivement servie
        env:
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          for attempt in {1..15}; do
            if marker="$(curl --fail --silent --proto '=https' --max-time 6 \
              --max-filesize 8192 --header 'Cache-Control: no-cache' https://polradar.fr/build.json)" \
                && jq -e --arg revision "$SOURCE_SHA" '.sourceCommit == $revision' <<<"$marker" >/dev/null; then
              python3 scripts/etat-production.py --revision "$SOURCE_SHA"
              exit 0
            fi
            if (( attempt < 15 )); then sleep 30; fi
          done
          echo "::error::La révision attendue reste absente du manifeste public."
          exit 1
