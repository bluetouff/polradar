name: Services Polradar
on:
  push:
    branches: [main]
    paths:
      [
        'mcp/**',
        'deploy/operations/**',
        'deploy/goaccess/**',
        '.github/workflows/services.yml',
        'tests/deploy/test_private_services.py',
      ]
  pull_request:
    paths:
      [
        'mcp/**',
        'deploy/operations/**',
        'deploy/goaccess/**',
        '.github/workflows/services.yml',
        'tests/deploy/test_private_services.py',
      ]
  workflow_dispatch:
permissions: {}
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: mcp/go.mod
          cache-dependency-path: mcp/go.sum
      - name: Vérifier le service et le rapport privé
        run: |
          cd mcp
          go mod verify
          go vet ./...
          go test -race ./...
          cd ..
          python3 -m unittest discover -s tests/deploy -p test_private_services.py -v
      - name: Analyser les dépendances Go du service
        working-directory: mcp
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...
      - name: Retrouver l’archive de la CI Site pour cette révision
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
          EXPECTED_EVENT: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          destination="$RUNNER_TEMP/contrat-site"
          mkdir -m 700 "$destination"
          for attempt in {1..45}; do
            runs="$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/site.yml/runs" -f head_sha="$HEAD_REVISION" -f per_page=20)"
            run="$(jq -r --arg event "$EXPECTED_EVENT" --arg repo "$GITHUB_REPOSITORY" '.workflow_runs | map(select((.event == $event or ($event == "workflow_dispatch" and .event == "push")) and (.head_repository.full_name == $repo or $event == "pull_request"))) | first | .id // empty' <<<"$runs")"
            if [[ "$run" =~ ^[0-9]+$ ]]; then
              artifact="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/artifacts" --jq '.artifacts[] | select(.name == "validated-site" and .expired == false) | .id')"
              if [[ "$artifact" =~ ^[0-9]+$ ]]; then
                gh run download "$run" --repo "$GITHUB_REPOSITORY" --name validated-site --dir "$destination"
                python3 scripts/test-mcp-release.py "$destination/site.tar.gz"
                exit 0
              fi
              state="$(jq -r --arg id "$run" '.workflow_runs[]|select((.id|tostring)==$id)|.conclusion // empty' <<<"$runs")"
              if [[ -n "$state" && "$state" != success ]]; then echo "La validation du site a échoué."; exit 1; fi
            fi
            sleep 15
          done
          echo 'Archive vérifiée du même commit indisponible.'
          exit 1
      - name: Préparer les paquets sans identifiants
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            (cd mcp && CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath -ldflags="-s -w -X main.serviceCommit=$GITHUB_SHA" -o "$RUNNER_TEMP/mcp-$arch" .)
            python3 deploy/operations/package.py mcp --out artifacts/ --arch "$arch" --binary "$RUNNER_TEMP/mcp-$arch"
          done
          python3 deploy/operations/package.py gsc --out artifacts/
          python3 deploy/operations/package.py launcher --out artifacts/
          cd artifacts
          sha256sum --check ./*.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          name: services-operateur
          path: artifacts/
          retention-days: 7
  publish:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: services-operateur
          path: artifacts
      - id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            artifacts/*.tar.gz
            artifacts/polradar-activer.sh
      - name: Publier les paquets opérateur
        working-directory: artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ATTESTATION: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          set -euo pipefail
          sha256sum --check ./*.sha256
          tag="services-$GITHUB_SHA"
          if gh release view "$tag" >/dev/null 2>&1; then exit 0; fi
          cp -- "$ATTESTATION" services.sigstore.json
          gh release create "$tag" ./*.tar.gz ./*.sha256 polradar-activer.sh services.sigstore.json --target "$GITHUB_SHA" --latest=false --title "Services ${GITHUB_SHA:0:12}" --notes "Serveur MCP public en lecture seule et rapport Search Console privé. Activation par l’opérateur."
