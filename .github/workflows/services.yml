name: Services Polradar
on:
  workflow_run:
    workflows: [Site]
    types: [completed]
    branches: [main]
  pull_request:
    paths:
      [
        'mcp/**',
        'scripts/test-mcp-compatibility.py',
        'scripts/service-release-needed.py',
        'scripts/test-apache-privacy.py',
        'scripts/test-mcp-release.py',
        'tests/deploy/test_socket_handover.py',
        'deploy/operations/**',
        'deploy/goaccess/**',
        '.github/workflows/services.yml',
        'tests/deploy/test_private_services.py',
      ]
  workflow_dispatch:
permissions: {}
jobs:
  qualify:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_sha == github.sha)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      needed: ${{ steps.plan.outputs.needed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" != workflow_run ]]; then echo 'needed=true' >> "$GITHUB_OUTPUT"; exit 0; fi
          gh release list --limit 100 --json tagName,isDraft,isPrerelease > "$RUNNER_TEMP/releases.json"
          python3 scripts/service-release-needed.py "$RUNNER_TEMP/releases.json" >> "$GITHUB_OUTPUT"
  build:
    needs: qualify
    if: needs.qualify.outputs.needed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: mcp/go.mod
          cache-dependency-path: mcp/go.sum
      - name: Vérifier le service et le rapport privé
        run: |
          cd mcp
          go mod verify
          go vet ./...
          go test -race ./...
          cd ..
          python3 -m unittest discover -s tests/deploy -p test_private_services.py -v
      - name: Vérifier les journaux Apache avec une requête témoin locale
        run: |
          if ! test -x /usr/sbin/apache2; then sudo apt-get update -qq && sudo apt-get install -y apache2; fi
          python3 scripts/test-apache-privacy.py
      - name: Analyser les dépendances Go du service
        working-directory: mcp
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...
      - name: Télécharger l’archive validée du même commit
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          SITE_RUN: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$SITE_RUN" ]]; then
            SITE_RUN="$(gh run list --workflow site.yml --branch main --commit "$GITHUB_SHA" --event push --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
          fi
          [[ "$SITE_RUN" =~ ^[0-9]+$ ]]
          gh run download "$SITE_RUN" --repo "$GITHUB_REPOSITORY" --name validated-site --dir "$RUNNER_TEMP/contrat-site"
          python3 scripts/test-mcp-release.py "$RUNNER_TEMP/contrat-site/site.tar.gz"
      - name: Préparer les paquets sans identifiants
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            (cd mcp && CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath -ldflags="-s -w -X main.serviceCommit=$GITHUB_SHA" -o "$RUNNER_TEMP/mcp-$arch" .)
            python3 deploy/operations/package.py mcp --out artifacts/ --arch "$arch" --binary "$RUNNER_TEMP/mcp-$arch"
          done
          python3 deploy/operations/package.py gsc --out artifacts/
          python3 deploy/operations/package.py launcher --out artifacts/
          cd artifacts
          sha256sum --check ./*.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          name: services-operateur
          path: artifacts/
          retention-days: 7
  publish:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: services-operateur
          path: artifacts
      - id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            artifacts/*.tar.gz
            artifacts/polradar-activer.sh
      - name: Publier les paquets opérateur
        working-directory: artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ATTESTATION: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          set -euo pipefail
          sha256sum --check ./*.sha256
          tag="services-$GITHUB_SHA"
          if gh release view "$tag" >/dev/null 2>&1; then exit 0; fi
          cp -- "$ATTESTATION" services.sigstore.json
          gh release create "$tag" ./*.tar.gz ./*.sha256 polradar-activer.sh services.sigstore.json --target "$GITHUB_SHA" --latest=false --title "Services ${GITHUB_SHA:0:12}" --notes "Serveur MCP public en lecture seule et rapport Search Console privé. Activation par l’opérateur."
