name: Suggestions de sources officielles
on:
  schedule:
    - cron: '20 8,18 * * *'
      timezone: Europe/Paris
  workflow_dispatch:

permissions: {}
concurrency:
  group: polradar-source-suggestions
  cancel-in-progress: false

jobs:
  collect:
    if: github.repository == 'bluetouff/polradar' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      issues: read
    outputs:
      decisions: ${{ steps.prepare.outputs.decisions }}
      additions: ${{ steps.prepare.outputs.additions }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lire la file du formulaire
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          gh api --method GET repos/bluetouff/polradar/issues \
            -f state=open -f labels=source-officielle -F per_page=12 \
            -f sort=created -f direction=asc > "$RUNNER_TEMP/source-issues.json"
      - name: Vérifier les références auprès des institutions
        id: prepare
        run: |
          set -euo pipefail
          python3 scripts/source-suggestions.py collect "$RUNNER_TEMP/source-decisions.json" \
            --issues "$RUNNER_TEMP/source-issues.json" | tee -a "$GITHUB_STEP_SUMMARY"
          python3 - "$RUNNER_TEMP/source-decisions.json" >> "$GITHUB_OUTPUT" <<'PY'
          import json
          import sys
          from pathlib import Path
          rows = json.loads(Path(sys.argv[1]).read_bytes())
          print(f"decisions={str(bool(rows)).lower()}")
          print(f"additions={str(any(row['status'] == 'added' for row in rows)).lower()}")
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.prepare.outputs.decisions == 'true'
        with:
          name: source-suggestions
          path: ${{ runner.temp }}/source-decisions.json
          if-no-files-found: error
          retention-days: 2

  publish:
    needs: collect
    if: needs.collect.outputs.additions == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      issues: read
    environment: polradar-data-publish
    concurrency:
      group: polradar-main-data-writer
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: source-suggestions
          path: ${{ runner.temp }}
      - name: Ajouter les références au catalogue courant
        id: apply
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/source-suggestions.py apply "$RUNNER_TEMP/source-decisions.json"
          if git diff --quiet -- src/data/sources.json; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.apply.outputs.changed == 'true'
        with:
          node-version-file: .node-version
          cache: npm
      - name: Valider et enregistrer les références
        if: steps.apply.outputs.changed == 'true'
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          ./node_modules/.bin/prettier --write src/data/sources.json
          node scripts/validate-content.mjs
          git add -- src/data/sources.json
          git diff --cached --check
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Ajoute les sources institutionnelles proposées'
      - name: Déclencher la publication habituelle
        if: steps.apply.outputs.changed == 'true'
        env:
          POLRADAR_DATA_PUSH_KEY: ${{ secrets.POLRADAR_DATA_PUSH_KEY }}
        run: bash scripts/push-published-data.sh

  settle:
    needs: [collect, publish]
    if: ${{ !cancelled() && needs.collect.outputs.decisions == 'true' && (needs.publish.result == 'success' || needs.publish.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 11
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: source-suggestions
          path: ${{ runner.temp }}
      - name: Indiquer le résultat sur les propositions
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/source-suggestions.py settle "$RUNNER_TEMP/source-decisions.json"
