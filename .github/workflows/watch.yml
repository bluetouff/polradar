name: Veille des sources
on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: source-watch
  cancel-in-progress: false
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Relever les sources autorisées
        run: python3 scripts/watch-sources.py
      - name: Résumé de la veille
        run: cat artifacts/watch-report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Relever les fichiers Arcom pour examen
        run: python3 scripts/collect-airtime.py
      - name: Résumé des relevés Arcom
        run: cat artifacts/airtime-review/report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Relever les séries économiques pour examen
        run: python3 scripts/collect-economy.py
      - name: Résumé des séries économiques
        run: cat artifacts/economy-review/report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: source-watch-review
          path: artifacts/watch-report.*
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: airtime-review
          path: artifacts/airtime-review/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: economy-review
          path: artifacts/economy-review/
          if-no-files-found: error
          retention-days: 14
