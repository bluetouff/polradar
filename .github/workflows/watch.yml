name: Veille des sources
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  watch:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - run: python3 scripts/watch-sources.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: source-watch-pcf-${{ matrix.os }}
          path: artifacts/watch-report.*
          if-no-files-found: error
