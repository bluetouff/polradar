name: Qualify Actions artifact compatibility
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  old-upload-new-download:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: python3 -c "from pathlib import Path; Path('marker.txt').write_bytes(b'Polradar artifact compatibility\n')"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: old-upload-marker
          path: marker.txt
          if-no-files-found: error
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: old-upload-marker
          path: restored
      - run: python3 -c "from pathlib import Path; assert Path('restored/marker.txt').read_bytes() == b'Polradar artifact compatibility\n'"
  new-upload-new-download:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: python3 -c "from pathlib import Path; Path('marker.txt').write_bytes(b'Polradar artifact compatibility\n')"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: new-upload-marker
          path: marker.txt
          if-no-files-found: error
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: new-upload-marker
          path: restored
      - run: python3 -c "from pathlib import Path; assert Path('restored/marker.txt').read_bytes() == b'Polradar artifact compatibility\n'"
