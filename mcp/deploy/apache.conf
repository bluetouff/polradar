# Polradar MCP. Included only inside the polradar.fr TLS virtual host.
ProxyPassMatch "^/api/(?:mcp|mcp-stats[.]json|v1/.*)$" "unix:/run/polradar-mcp.sock|http://polradar.fr" timeout=15 retry=0
SetEnvIf Request_URI "^/api/(mcp|mcp-stats[.]json|v1/.*)$" polradar_stats_request
# An API query can also reach an ordinary page in an incoming Referer.
SetEnvIfNoCase Referer "^[^?#]*/api/(v1/|mcp([/?#]|$))" polradar_stats_request
# Keep actionable Apache errors without appending client or Referer headers.
ErrorLogFormat "[%t] [%m:%l] [pid %P] [request %L] %M"
<LocationMatch "^/api/(mcp|mcp-stats[.]json|v1/.*)$">
    Require expr "%{HTTP_HOST} =~ m#(?i)^polradar[.]fr(?::443)?$#"
    LimitRequestBody 16384
    RequestHeader set X-Polradar-Client "expr=%{REMOTE_ADDR}"
    RequestHeader unset Proxy
    RequestHeader unset Authorization
    RequestHeader unset Cookie
    Header always set Cache-Control "no-store"
    Header always set Referrer-Policy "no-referrer"
    Header always set X-Content-Type-Options "nosniff"
</LocationMatch>
